name: Backend e infraestrutura
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ia_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: ia_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ia_test -d ia_test" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run load:infra
        env:
          INTEGRATION_DATABASE_URL: postgres://ia_test:synthetic-ci-only@127.0.0.1:5432/ia_test
          LOAD_USERS: '300'
